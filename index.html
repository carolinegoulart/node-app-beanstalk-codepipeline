<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello — CodePipeline Test</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #2ecc71;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: #1a3d2e;
      }

      main {
        text-align: center;
        padding: 2rem;
      }

      h1 {
        font-size: clamp(2rem, 6vw, 3.5rem);
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      p {
        margin-top: 0.75rem;
        font-size: 1.125rem;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello, World!</h1>
      <p>Deployed with AWS CodePipeline</p>
    </main>
  </body>
</html>
