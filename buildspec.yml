version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
  pre_build:
    commands:
      - echo "Preparing static site artifact..."
  build:
    commands:
      - echo "Build complete — no compile step for static HTML"
  post_build:
    commands:
      - echo "Artifact ready for deploy stage"

artifacts:
  files:
    - index.html
  name: static-site-$(date +%Y-%m-%d)
