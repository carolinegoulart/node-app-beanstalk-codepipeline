version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm ci
  pre_build:
    commands:
      - echo "Running unit tests..."
  build:
    commands:
      - npm test
  post_build:
    commands:
      - if [ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ]; then echo "Build succeeded"; fi

artifacts:
  files:
    - package.json
    - package-lock.json
    - src/**/*
    - public/**/*
  name: node-app-$CODEBUILD_BUILD_ID
